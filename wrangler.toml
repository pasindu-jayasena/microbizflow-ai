name = "microbizflow-ai"
pages_build_output_dir = "./dist/web"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "microbizflow-demo"
database_id = "8999f517-eabe-4923-a647-5fcaa6d85017"
preview_database_id = "DB"
migrations_dir = "db/migrations"

[vars]
DEMO_BUSINESS_SLUG = "harbour-cut"
DEMO_MODE = "true"
ALLOWED_ORIGIN = "https://microbizflow-ai.pages.dev"

# Production-only bindings keep local Pages and CI free of remote inference calls.
[[env.production.d1_databases]]
binding = "DB"
database_name = "microbizflow-demo"
database_id = "8999f517-eabe-4923-a647-5fcaa6d85017"
preview_database_id = "DB"
migrations_dir = "db/migrations"

[env.production.vars]
DEMO_BUSINESS_SLUG = "harbour-cut"
DEMO_MODE = "true"
ALLOWED_ORIGIN = "https://microbizflow-ai.pages.dev"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
DRAFT_AI_ENABLED = "true"
OPERATIONS_AI_ENABLED = "true"

[env.production.ai]
binding = "AI"
