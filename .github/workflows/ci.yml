name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python -m unittest discover -s tests
      - run: npm run build
      - run: google-chrome --version
      - run: npm run db:migrate:local
      - run: npm run db:seed:local
      - name: Configure a disposable local owner for browser tests
        run: |
          test_password=$(openssl rand -hex 20)
          printf '%s' "$test_password" | npm run owner:setup:local
          echo "LOCAL_OWNER_PASSWORD=$test_password" >> "$GITHUB_ENV"
      - run: npm run test:e2e
